# Aris ROS 2 Jazzy dev harness.
#
# SAFETY, by construction:
#   * default bridge network only  -- NO network_mode: host
#   * no privileged, no cap_add, no /dev mounts, no --ipc=host
#   * ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST confines DDS to the container
#   * every host bind mount is READ-ONLY
# The lab robots (128.30.16.50/.55) and the 192.168.0.0/24 and 128.30.28.0/22
# networks are therefore unreachable from here, and no ROS traffic leaks out.
#
# Usage:
#   ./build.sh
#   docker compose run --rm dev                      # interactive shell
#   docker compose run --rm dev bash /opt/aris_test/test_smoke.sh
#
# Swap the controller source (e.g. to the 378-line live operator copy):
#   ARIS_CONTROLLER_SRC=/path/to/cartesian_impedance_controller docker compose run --rm dev

services:
  dev:
    image: ${ARIS_IMAGE:-aris/jazzy-dev}:${ARIS_TAG:-d812aab}
    # No `network_mode`, no `networks` -> compose default bridge. Do not change.
    init: true
    stdin_open: true
    tty: true
    working_dir: /aris_ws
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-13}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      RCUTILS_COLORIZED_OUTPUT: "1"
      MAKEFLAGS: "-j8"
      ARIS_COLCON_WORKERS: "2"
    volumes:
      # The rtff worktree (executor + dispatch scripts), read-only.
      - type: bind
        source: ${ARIS_RTFF_SRC:-/home/franka/aris_project/worktrees/aris2-rtff}
        target: /src/rtff
        read_only: true
      # The controller package source. Point ARIS_CONTROLLER_SRC at the
      # directory that CONTAINS package.xml; it is built into /aris_ws.
      - type: bind
        source: ${ARIS_CONTROLLER_SRC:-/home/franka/aris_project/worktrees/aris2-rtff/aris_kindt_dwatkins_ztouch_control/ros2_ws/src/cartesian_impedance_controller}
        target: /src/controller
        read_only: true
      # The planner repo, read-only: `aris_sixarm.sil` (the Drake plant + the
      # ROS wrapper of T8) runs straight off the working tree over PYTHONPATH.
      # NEVER pip-installed into the image.
      - type: bind
        source: ${ARIS_SIXARM_SRC:-/home/franka/aris_project/aris_sixarm}
        target: /src/aris_sixarm
        read_only: true
      # `aris_sixarm.ik` loads a compiled _franka_ik*.so that lives outside the
      # repo (see aris_sixarm/ik.py); ARIS_FRANKA_IK_PATH in the image points
      # here.  cp312 on Ubuntu 24.04 both sides, so it loads as built.
      - type: bind
        source: ${ARIS_IK_SRC:-/home/franka/aris_project/franka_analytical_ik}
        target: /src/franka_analytical_ik
        read_only: true
      # Live test scripts, so they can be edited without an image rebuild.
      # (A copy is baked into the image too, so the image stands alone.)
      - type: bind
        source: ./test
        target: /opt/aris_test
        read_only: true
      # Somewhere to drop logs/artifacts that outlive the container.
      - type: bind
        source: ${ARIS_OUT_DIR:-./out}
        target: /out
      # /aris_ws build+install tree in a named volume, so the overlay build is
      # incremental across `docker compose run` invocations.
      - aris_ws:/aris_ws

volumes:
  aris_ws:
