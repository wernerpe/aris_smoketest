[project]
name = "aris_sixarm"
version = "0.1.0"
description = "Motion analysis & planning for the Aris Kindt six-arm drawing installation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "meshcat",
    "trimesh",
    "fast-simplification",
    "scipy",
    "shapely",
    "networkx",
    "rtree",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]
# The browser GUI (aris_sixarm/gui, web/viewer).  Kept out of the base
# dependencies so a headless planning machine installs nothing it will not
# run, and out of `dev` so `pip install -e '.[dev]'` on the robot PC is
# unchanged.  three.js is VENDORED under web/viewer/vendor (see its
# VENDOR.md) rather than fetched at run time, because the robot PC is offline.
gui = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "httpx",          # fastapi.testclient, and the backend smoke test
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aris_sixarm*"]
