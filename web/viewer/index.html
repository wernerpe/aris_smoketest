<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aris stroke planner</title>
<!-- inline, so an offline machine does not spend a 404 on every page load -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314161a'/%3E%3Cpath d='M3 12 L8 4 L13 12' stroke='%23cb6608' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #14161a;  --panel: #1b1e24;  --panel2: #22262e;  --line: #2e333d;
  --fg: #e6e8ec;  --dim: #939aa6;  --dim2: #6d7480;
  --accent: #cb6608;  --ok: #3fa46a;  --warn: #d8a13a;  --bad: #d2544a;
  --run: #4a8fd2;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 13px/1.45 var(--mono);
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
h1, h2, h3 { margin: 0; font-weight: 600; }

/* ---------------- header ---------------- */
header {
  display: flex; align-items: center; gap: 14px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 14px; letter-spacing: .04em; }
header h1 span { color: var(--accent); }
.badge {
  font-size: 11px; padding: 2px 7px; border-radius: 3px;
  background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
}
.badge.live { color: var(--run); border-color: var(--run); }
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.spacer { flex: 1; }

/* ---------------- layout ---------------- */
main { display: grid; grid-template-columns: 330px 1fr; min-height: 0; }
aside {
  background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; padding: 10px 12px 40px;
}
#stage { display: grid; grid-template-rows: 1.15fr auto 0.85fr; min-height: 0; }

/* ---------------- form ---------------- */
.group { margin-bottom: 14px; }
.group > h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--dim2); margin-bottom: 6px; border-bottom: 1px solid var(--line);
  padding-bottom: 3px; cursor: pointer; user-select: none;
}
.group > h3::before { content: "▾ "; color: var(--dim2); }
.group.collapsed > h3::before { content: "▸ "; }
.group.collapsed .body { display: none; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 5px; }
.row.one { grid-template-columns: 1fr; }
label { display: block; font-size: 10.5px; color: var(--dim); margin-bottom: 2px; }
input, select, button, textarea {
  width: 100%; font: 12px var(--mono); color: var(--fg);
  background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
  padding: 4px 6px;
}
input[type=checkbox] { width: auto; margin-right: 5px; vertical-align: -1px; }
.check { font-size: 11.5px; color: var(--dim); margin-bottom: 3px; }
button { cursor: pointer; background: var(--panel2); }
button:hover { border-color: var(--dim2); }
button.primary { background: var(--accent); color: #17130f; border-color: var(--accent); font-weight: 600; }
button.danger  { color: var(--bad); border-color: var(--bad); }
button:disabled { opacity: .4; cursor: default; }
/* A DISABLED RUN BUTTON MUST NOT LOOK ARMED.  `primary` is the accent fill;
   at 40 % opacity on this ground it still reads as the bright one, and the one
   button on the page that moves a robot may not be the button that looks ready
   when it is not. */
button.primary:disabled { background: var(--panel2); color: var(--dim2);
                          border-color: var(--line); opacity: 1; }
.btnrow { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; margin: 10px 0; }
.btnrow.one { grid-template-columns: 1fr; }

/* ---------------- day 1 verdict ---------------- */
#day1out { margin-top: 8px; }
#day1out .verdict {
  font-size: 11px; line-height: 1.4; white-space: pre-wrap;
  word-break: break-word; padding: 5px 7px; border-radius: 3px;
  border: 1px solid var(--line); background: var(--panel2);
}
#day1out .verdict.ok  { color: var(--ok);  border-color: var(--ok); }
#day1out .verdict.bad { color: var(--bad); border-color: var(--bad); }
#day1out .filerow {
  display: grid; grid-template-columns: 1fr auto; gap: 5px;
  align-items: center; margin-top: 4px;
}
#day1out .filerow code {
  font-size: 10px; color: var(--dim); overflow-wrap: anywhere;
}
#day1out .filerow button { width: auto; font-size: 10px; padding: 2px 7px; }

/* ---------------- run on arm ---------------- */
.opwarn {
  color: var(--bad); border: 1px solid var(--bad); border-radius: 3px;
  padding: 4px 6px; font-size: 10.5px; margin-bottom: 6px;
}
.opmap {
  font-size: 11px; color: var(--fg); background: var(--panel2);
  border: 1px solid var(--line); border-left: 3px solid var(--ok);
  border-radius: 3px; padding: 3px 6px; margin: 4px 0;
}
.opmap.warn { border-left-color: var(--warn); color: var(--warn); }
.opsite { border-bottom: 1px solid var(--line); padding-bottom: 8px;
          margin-bottom: 8px; }
#opident { margin: 4px 0 8px; }
#opident .idrow {
  display: flex; gap: 8px; align-items: baseline; font-size: 11px;
  border-top: 1px solid var(--line); padding-top: 3px; margin-top: 3px;
}
#opident .idrow.ok { color: var(--ok); } #opident .idrow.bad { color: var(--dim2); }
#opident .idq { font-size: 10px; color: var(--dim);
                font-variant-numeric: tabular-nums; white-space: pre-wrap;
                word-break: break-word; }
#opident .idq.bad { color: var(--bad); }
#opident button.wee { width: auto; font-size: 10px; padding: 1px 6px;
                      margin-top: 2px; }
#opout { max-height: 200px; overflow-y: auto; background: #101216;
         border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px;
         margin: 6px 0; }
#opout .opline { font-size: 10.5px; white-space: pre-wrap;
                 word-break: break-word; color: var(--dim); }
#opout .opline.cmd { color: var(--accent); }
#opout .opline.ok  { color: var(--ok); }
#opout .opline.bad { color: var(--bad); }
#optail { max-height: 180px; overflow-y: auto; background: #101216;
          border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px;
          font-size: 10.5px; color: var(--dim); white-space: pre-wrap;
          word-break: break-word; margin: 0; }
b.bad { color: var(--bad); }

/* ---------------- job list ---------------- */
#joblist { display: flex; flex-direction: column; gap: 3px; }
.job {
  padding: 5px 7px; border: 1px solid var(--line); border-radius: 3px;
  background: var(--panel2); cursor: pointer; font-size: 11px;
}
.job:hover { border-color: var(--dim2); }
.job.sel { border-color: var(--accent); }
.job .t { color: var(--dim); }
.job .st { float: right; font-weight: 600; }
.st.running { color: var(--run); } .st.done { color: var(--ok); }
.st.failed { color: var(--bad); } .st.cancelled { color: var(--warn); }
.st.queued { color: var(--dim); }

/* ---------------- viewport ---------------- */
#view { position: relative; min-height: 0; background: #0f1114; }
#view canvas { display: block; width: 100%; height: 100%; }
#viewhud {
  position: absolute; top: 8px; left: 10px; font-size: 11px; color: var(--dim);
  pointer-events: none; text-shadow: 0 1px 3px #000;
}
/* what the tool in the picture IS — a modelled number is not a measured one,
   and this line says which it is */
#toolnote {
  position: absolute; bottom: 6px; left: 10px; font-size: 11px;
  color: var(--dim); pointer-events: none; max-width: 72%;
  background: #0f1114cc; padding: 2px 7px; border-radius: 3px;
}
#viewtools {
  position: absolute; top: 6px; right: 8px; display: flex; gap: 4px;
  flex-wrap: wrap; justify-content: flex-end; max-width: 60%;
}
#viewtools button, #viewtools label {
  font-size: 10.5px; padding: 2px 6px; width: auto; background: #1b1e24cc;
  border: 1px solid var(--line); border-radius: 3px; color: var(--dim);
  cursor: pointer; margin: 0;
}
#viewtools label.on, #viewtools button.on { color: var(--fg); border-color: var(--dim2); }
#banner {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 5px 10px;
  background: #d2544ae0; color: #fff; font-size: 11.5px; display: none;
}

/* ---------------- middle strip ---------------- */
#strip { border-top: 1px solid var(--line); background: var(--panel);
         padding: 6px 10px 8px; overflow-x: auto; }
.stagebar { display: grid; grid-template-columns: 90px 1fr 70px 58px; gap: 6px;
            align-items: center; font-size: 11px; margin-bottom: 2px; }
.stagebar .nm { color: var(--dim); }
.stagebar .track { position: relative; height: 13px; background: var(--panel2);
                   border-radius: 2px; overflow: hidden; }
/* the fill is deliberately DIMMER than any substage colour: it is the
   background the coloured bands are read against, not a band itself */
.stagebar .fill { position: absolute; inset: 0 auto 0 0; background: #2f4256;
                  transition: width .15s linear; }
.stagebar.done .fill { background: #2b4a39; }
.stagebar.failed .fill { background: #5a2f2b; }
.stagebar.aborted .fill { background: #5a4a2b; }
.stagebar.idle .fill { background: var(--line); }
.stagebar .subs { position: absolute; inset: 0; display: flex; }
.stagebar .sub { height: 100%; opacity: .85; }
.stagebar .el { text-align: right; color: var(--dim); }
.stagebar .ct { text-align: right; color: var(--dim2); font-size: 10px; }
.stagebar .track .lbl { position: absolute; inset: 0; display: flex;
   align-items: center; justify-content: center; font-size: 10px; color: #0d0f12;
   mix-blend-mode: normal; font-weight: 600; }

#counters { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 2px;
            font-size: 11px; color: var(--dim); }
#counters b { color: var(--fg); font-weight: 600; }
#loads { display: flex; gap: 5px; margin-top: 4px; align-items: flex-end;
         height: 34px; }
#loads .lb { width: 34px; display: flex; flex-direction: column;
             justify-content: flex-end; align-items: center; height: 100%; }
#loads .bar { width: 100%; background: var(--run); border-radius: 2px 2px 0 0;
              min-height: 1px; }
#loads .lb span { font-size: 9px; color: var(--dim2); }

/* ---------------- bottom ---------------- */
#bottom { display: grid; grid-template-columns: 1fr 420px; min-height: 0;
          border-top: 1px solid var(--line); }
#panels { min-height: 0; overflow-y: auto; padding: 8px 10px 20px;
          background: var(--bg); }
#log { min-height: 0; overflow-y: auto; background: #101216; padding: 6px 9px;
       border-left: 1px solid var(--line); font-size: 11px; line-height: 1.35; }
#log div { white-space: pre-wrap; word-break: break-word; }
#log .e-error { color: var(--bad); }
#log .e-stage { color: var(--accent); font-weight: 600; }
#log .e-item { color: var(--dim2); }
#log .e-info { color: var(--dim); }
#log .e-metric { color: var(--run); }

.tabs { display: flex; gap: 4px; margin-bottom: 7px; }
.tabs button { width: auto; font-size: 11px; padding: 3px 9px; }
.tabs button.on { border-color: var(--accent); color: var(--fg); }
.pane { display: none; } .pane.on { display: block; }

table.k { width: 100%; border-collapse: collapse; font-size: 11px; }
table.k td, table.k th { padding: 2px 6px; border-bottom: 1px solid var(--line);
                         text-align: left; }
table.k th { color: var(--dim2); font-weight: 500; }
table.k td.n { text-align: right; font-variant-numeric: tabular-nums; }

/* per-arm lanes / scrubber */
#player { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#player button { width: auto; padding: 3px 10px; }
#scrub { flex: 1; }
#lanes { width: 100%; }
.lane { display: grid; grid-template-columns: 46px 1fr; gap: 6px;
        align-items: center; margin-bottom: 2px; }
.lane .anm { font-size: 10.5px; color: var(--dim); }
.lane canvas { width: 100%; height: 15px; display: block; border-radius: 2px;
               background: var(--panel2); }
#spark { display: flex; flex-direction: column; gap: 2px; }
.spk { display: grid; grid-template-columns: 62px 1fr 116px; gap: 6px;
       align-items: center; font-size: 10.5px; }
.spk canvas { width: 100%; height: 22px; display: block; cursor: crosshair;
              background: var(--panel2); border-radius: 2px; }
.spk .v { text-align: right; font-variant-numeric: tabular-nums; }
.spk .v.bad { color: var(--bad); }
.muted { color: var(--dim2); font-size: 11px; }
.err { color: var(--bad); white-space: pre-wrap; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>ARIS <span>stroke planner</span></h1>
  <span class="badge" id="b-rig">—</span>
  <span class="badge" id="b-job">no job</span>
  <span class="badge" id="b-conn">offline</span>
  <div class="spacer"></div>
  <span class="badge" id="b-clock">0.0 s</span>
</header>

<main>
  <aside id="side"></aside>

  <div id="stage">
    <div id="view">
      <div id="viewhud"></div>
      <div id="toolnote"></div>
      <div id="viewtools"></div>
      <div id="banner"></div>
    </div>

    <div id="strip">
      <div id="stages"></div>
      <div id="counters"></div>
      <div id="loads"></div>
    </div>

    <div id="bottom">
      <div id="panels">
        <div class="tabs" id="tabs"></div>
        <div class="pane on" id="pane-program"></div>
        <div class="pane" id="pane-clear"></div>
        <div class="pane" id="pane-stroke"></div>
        <div class="pane" id="pane-time"></div>
      </div>
      <div id="log"></div>
    </div>
  </div>
</main>

<script type="importmap">
{ "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "/vendor/OrbitControls.js"
} }
</script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
